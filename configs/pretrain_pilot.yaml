inherits: configs/default.yaml
experiment:
  name: pretrain_jepa_pilot
data:
  topology: canonical_sign89
  window_size: 96
  joint_dropout: [0.20, 0.55]
jepa:
  encoder_type: temporal_transformer
  d_model: 128
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  predictor_hidden_dim: 256
  target_encoder_ema:
    base_tau: 0.996
    final_tau: 1.0
  loss:
    vicreg_weight: 0.1
    norm_weight: 0.05
pretraining:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.05
  num_workers: 2
  log_every_steps: 100
  val_batches: 12
  checkpoint_warmup_steps: 1000
