[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-for-real-time-lsf"
version = "0.1.0"
description = "Skeleton-JEPA research pipeline for weakly supervised LSF keypoints-to-French translation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.2",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vision = ["opencv-python>=4.9", "mediapipe>=0.10"]
text = ["sentencepiece>=0.2"]
viz = ["scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

